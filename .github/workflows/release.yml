name: Release

# Builds the portable Tauri app for Windows and attaches the binary + updater
# signature to a GitHub Release. A latest.json manifest is generated so the
# built-in auto-updater can discover new versions.
#
# Triggers:
#   - pushing a semver tag (v1.2.3)  -> creates a new DRAFT release for that tag
#   - creating a release manually    -> builds and uploads the assets to it
on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [created]

# Required so the GITHUB_TOKEN can create the release and upload assets
permissions:
  contents: write

env:
  # Project lives in a subfolder: TMC/src-tauri (backend) + TMC/ui (frontend)
  FRONTEND_DIR: TMC/ui

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: TMC/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build and publish portable Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: TMC
          # Build with updater artifacts enabled (tauri.conf.json has
          # createUpdaterArtifacts: true).  This produces the portable exe
          # plus its .sig signature file inside target/release/bundle/.
          args: --bundles nsis
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: 'Tommy Memory Cleaner ${{ github.event.release.tag_name || github.ref_name }}'
          releaseBody: 'See the attached assets to download and install this version.'
          releaseDraft: true
          prerelease: false

      # tauri-action already uploads the NSIS exe + .sig and generates
      # latest.json.  Below we additionally upload the raw portable exe
      # (the standalone TommyMemoryCleaner.exe from target/release/) so
      # users who prefer the portable version can grab it directly.

      - name: Upload portable exe to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: TMC/src-tauri/target/release/TommyMemoryCleaner.exe
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
