[package]
name = "TommyMemoryCleaner"
version = "4.0.0"
edition = "2021"
publish = false
authors = ["tommy437"]
description = "Advanced Memory Optimization Tool"

# Windows resource file for version info
build = "build.rs"

[dependencies]
# Image processing per tray icon
image = "0.25"

tiny-skia = "0.11"

rusttype = "0.9"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bit flags
bitflags = { version = "2", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["time", "sync"] }

# Singletons and utilities
once_cell = "1.19"
scopeguard = "1.2"

# Better synchronization primitives
parking_lot = "0.12"

# Directories
dirs = "5.0"

# Random for anti-detection
rand = "0.8"

# For advanced memory operations
memmap2 = "0.9"
page_size = "0.5"

# For thread manipulation
thread-control = "0.1"

# Windows native notifications
winrt-notification = "0.5"


# Windows APIs (using windows-sys for consistency)
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication",
  "Win32_Security_Authentication_Identity",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_EventLog",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
] }

# NT API
ntapi = "0.4"

# Pure-Rust .lnk shortcut writer (replaces PowerShell WScript.Shell for the
# Startup-folder shortcut — spawning PowerShell from an elevated exe is a
# common AV heuristic trigger)
mslnk = "0.1"

# Tauri v2
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Dev dependencies for linting and testing

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]  # Only enable for dev builds

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Read by tauri-build (via tauri-winres) — the section name must be
# "tauri-winres", not "winres". ProductName, CompanyName, FileDescription and
# LegalCopyright are overridden by tauri-build from tauri.conf.json
# (productName, bundle.publisher, bundle.copyright); OriginalFilename is only
# settable here.
[package.metadata.tauri-winres]
OriginalFilename = "TommyMemoryCleaner.exe"
ProductName = "Tommy Memory Cleaner"
CompanyName = "Tommy Memory Cleaner"
FileDescription = "Advanced Memory Optimization Tool for Windows"
LegalCopyright = "© 2025 Tommy Memory Cleaner. All rights reserved."

[package.metadata.tauri]
[package.metadata.tauri.windows]
certificateThumbprint = "914A6D19C259888AD1F0CFFFFBD0C2054D33EE9E"
digestAlgorithm = "sha256"
timestampUrl = "http://timestamp.digicert.com"
